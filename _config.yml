
title: PORTAFOLIO STEVEN G. VELEZ
email:
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
twitter_username: username
github_username: username
minimal_mistakes_skin: neon
search: true

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages


# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

author:
  name   : "Steven Andres Guacheta Velez"
  avatar : "/assets/images/bio-photo.png"
  location: "Cali, Valle del Cauca, Colombia"
  bio    : "Apasionado por la organización, digitalización y sistematización de la información. Cuento con experiencia comprobada en el manejo de grandes volúmenes de datos, administración de contenidos web y cumplimiento de normativas técnicas. Actualmente combino mis conocimientos en arquitectura documental con el desarrollo de software para crear soluciones digitales eficientes, escalables y orientadas a la resolución rápida de problemas."
  links:

    - label: "guachetavelez@gmail.com"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:guachetavelez@gmail.com"

    - label: "Sitio Web"
      icon: "fas fa-fw fa-link"
      url: "https://"
    
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Steven-Velez"
    

footer:
  links:
    
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Steven-Velez"
    

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
